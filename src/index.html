<!DOCTYPE html>
<html>
<head>
  <title>Journal</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      font-family: Arial;
    }

    #history {
      width: 250px;
      border-right: 1px solid #ccc;
      overflow-y: auto;
      padding: 10px;
    }

    #editor-container {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    textarea {
      flex: 1;
      border: none;
      resize: none;
      padding: 20px;
      font-size: 16px;
    }

    .journal-item {
      cursor: pointer;
      padding: 8px;
    }

    .journal-item:hover {
      background: #eee;
    }
  </style>
</head>

<body>
  <div id="history"></div>

  <div id="editor-container">
    <h2 id="date"></h2>
    <textarea id="editor"></textarea>
  </div>

  <script type="module" src="./main.js"></script>
</body>
</html>
